[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remoterf"
version = "2.0.15"
description = "A python API to remotely access signal centric hardware. Client-side only! Courtesy of Wireless Lab @ UCLA & Prof. Ian Roberts."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ethan Ge", email = "ethoGalaxy@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.78.1,<2.0.0",
  "protobuf>=6.31.1,<7.0.0",
  "numpy",
  "prompt_toolkit",
  "python-dotenv",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
remoterf = "remoteRF.remoterf_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.crt", "*.key", "*.pem", "*.txt", "*.pyi", "*.proto"]
